[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# versions/*: autogenerated by Alembic from script.py.mako, not hand-written.
# env.py: Alembic's bootstrap requires the sys.path insert before importing server.*.
"server/migrations/versions/*" = ["E", "F", "I", "N", "UP", "B", "C4", "SIM"]
"server/migrations/env.py" = ["E402", "I001"]

[tool.pytest.ini_options]
# server/ has no __init__.py but server/tests/ does, so pytest would otherwise put
# server/ on sys.path (not the repo root) and every `import server.*` fails. Setting
# this means tests run with a bare `pytest`, without needing PYTHONPATH=. in CI.
pythonpath = ["."]
testpaths = ["server/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["server"]
omit = ["server/tests/*", "server/migrations/*"]

[tool.coverage.report]
fail_under = 80
