version: '3.8'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hesabu
      POSTGRES_PASSWORD: hesabu_password
      POSTGRES_DB: hesabu
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hesabu -d hesabu"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
